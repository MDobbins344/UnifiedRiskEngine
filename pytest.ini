[pytest]
# Collect only from tests/. Keeps pytest from walking venv/ and data/.
testpaths = tests

# Put the project root on sys.path so test files can `from src.options import ...`
# without each one inserting the parent directory by hand. The manual sys.path
# shim in tests/test_options.py stays, so the file still runs standalone with
# `python tests/test_options.py` and no framework installed.
pythonpath = .

# Show the reason for every non-passing test, including skips and expected
# failures, rather than a bare character in the progress line.
addopts = -ra
